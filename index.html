<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Recorder Player</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 35px;

      padding: 40px;
    }

    .buttons {
      display: flex;
      gap: 20px;
    }

    button {
      padding: 20px 28px;
      font-size: 22px;
    }

    .volume-container {
      height: 220px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    #volume {
      writing-mode: bt-lr;
      -webkit-appearance: slider-vertical;

      width: 30px;
      height: 220px;
    }

    label {
      font-size: 22px;

      display: flex;
      align-items: center;
      gap: 15px;
    }

    input[type="checkbox"] {
      width: 30px;
      height: 30px;
    }

  </style>
</head>

<body>

  <div class="controls">

    <div class="buttons">
      <button id="start">Start Rec</button>
      <button id="stop">Stop Rec</button>
    </div>

    <div class="volume-container">
      <input id="volume" type="range" min="0" max="8" step="0.01" value="1" />
    </div>

    <label>
      <input id="shuffle" type="checkbox" />
      Shuffle
    </label>

  </div>

  <script src="main.js"></script>

</body>
</html>
